<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Team helsesjekk</h1>
      <nav><a href="index.html">Skjema</a><a href="dashboard.html" class="active">Dashboard</a></nav>
    </div>
  </header>
  <main class="wrap">
    <h2>Dashboard</h2>
    <p class="lead">Svar fra Martin, Linn, Silje, Kåre og Olav. Skala 1–5.</p>

    <div class="tiles">
      <div class="card tile"><div class="label">Teamfornøydhet</div><div class="value" id="t-score"></div><div class="sub">snitt av alle svar</div></div>
      <div class="card tile"><div class="label">Positive svar</div><div class="value" id="t-pos"></div><div class="sub">andel svar 4 eller 5</div></div>
      <div class="card tile"><div class="label">Sterkest</div><div class="value" style="font-size:20px" id="t-best"></div><div class="sub" id="t-best-v"></div></div>
      <div class="card tile"><div class="label">Svakest</div><div class="value" style="font-size:20px" id="t-worst"></div><div class="sub" id="t-worst-v"></div></div>
    </div>

    <div class="grid2">
      <div class="card"><h3>Snitt per tema</h3><div class="chart-box" style="height:380px"><canvas id="c-tema"></canvas></div></div>
      <div class="card"><h3>Snitt per person</h3><div class="chart-box" style="height:380px"><canvas id="c-person"></canvas></div></div>
    </div>

    <div class="card">
      <h3>Alle svar</h3>
      <div class="table-wrap"><table id="tbl"></table></div>
      <p class="note" id="local-note"></p>
    </div>

    <div class="card comments">
      <h3>Kommentarer</h3>
      <div id="comments"></div>
    </div>
  </main>

  <script src="data.js"></script>
  <script>
    const answers = getAnswers();
    const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
    const fmt = n => n.toFixed(1).replace(".", ",");

    const allValues = PEOPLE.flatMap(p => answers[p].svar);
    const perTema = QUESTIONS.map((q, i) => avg(PEOPLE.map(p => answers[p].svar[i])));
    const perPerson = PEOPLE.map(p => avg(answers[p].svar));

    document.getElementById("t-score").textContent = fmt(avg(allValues)) + " / 5";
    document.getElementById("t-pos").textContent = Math.round(100 * allValues.filter(v => v >= 4).length / allValues.length) + " %";
    const best = perTema.indexOf(Math.max(...perTema));
    const worst = perTema.indexOf(Math.min(...perTema));
    document.getElementById("t-best").textContent = QUESTIONS[best].tema;
    document.getElementById("t-best-v").textContent = "snitt " + fmt(perTema[best]);
    document.getElementById("t-worst").textContent = QUESTIONS[worst].tema;
    document.getElementById("t-worst-v").textContent = "snitt " + fmt(perTema[worst]);

    // Farger fra CSS-variabler (lys/mørk modus)
    const css = getComputedStyle(document.documentElement);
    const v = name => css.getPropertyValue(name).trim();
    Chart.defaults.color = v("--text-2");
    Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    Chart.defaults.borderColor = v("--grid");

    const barOpts = (horizontal) => ({
      indexAxis: horizontal ? "y" : "x",
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => "Snitt: " + fmt(c.raw) } }
      },
      scales: {
        [horizontal ? "x" : "y"]: { min: 0, max: 5, ticks: { stepSize: 1 } },
        [horizontal ? "y" : "x"]: { grid: { display: false } }
      }
    });
    const barStyle = { backgroundColor: v("--accent"), borderRadius: 4, borderSkipped: "start", barPercentage: 0.7 };

    new Chart(document.getElementById("c-tema"), {
      type: "bar",
      data: { labels: QUESTIONS.map(q => q.tema), datasets: [{ data: perTema, ...barStyle }] },
      options: barOpts(true)
    });
    new Chart(document.getElementById("c-person"), {
      type: "bar",
      data: { labels: PEOPLE, datasets: [{ data: perPerson, ...barStyle, barPercentage: 0.5 }] },
      options: barOpts(false)
    });

    // Tabell (varmekart i én fargetone)
    const tbl = document.getElementById("tbl");
    const accent = v("--accent");
    const shade = n => `color-mix(in srgb, ${accent} ${Math.round((n - 1) / 4 * 70 + 8)}%, transparent)`;
    let html = "<thead><tr><th>Tema</th>" + PEOPLE.map(p => `<th>${p}${answers[p].lokal ? " *" : ""}</th>`).join("") + "<th>Snitt</th></tr></thead><tbody>";
    QUESTIONS.forEach((q, i) => {
      html += `<tr><td title="${q.tekst}">${q.tema}</td>` +
        PEOPLE.map(p => { const n = answers[p].svar[i]; return `<td class="cell" style="background:${shade(n)}">${n}</td>`; }).join("") +
        `<td class="cell">${fmt(perTema[i])}</td></tr>`;
    });
    html += "<tr><td><b>Snitt</b></td>" + perPerson.map(n => `<td class="cell">${fmt(n)}</td>`).join("") + `<td class="cell">${fmt(avg(allValues))}</td></tr></tbody>`;
    tbl.innerHTML = html;
    if (PEOPLE.some(p => answers[p].lokal))
      document.getElementById("local-note").textContent = "* Svar sendt inn fra skjemaet i denne nettleseren.";

    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    document.getElementById("comments").innerHTML = PEOPLE
      .filter(p => answers[p].kommentar)
      .map(p => `<p><b>${p}</b> ${esc(answers[p].kommentar)}</p>`).join("") || '<p class="note">Ingen kommentarer.</p>';
  </script>
</body>
</html>
